<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Marius Ranta — personal website, presented as a classic command prompt.">
  <title>Command Prompt — Marius Ranta</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Lucida Console", Consolas, "Courier New", monospace;
      background: #000;
      color: #008000;
      font-weight: 400;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    .window {
      width: 100%;
      height: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }
    .titlebar {
      height: 40px;
      flex: 0 0 40px;
      display: flex;
      align-items: stretch;
      gap: 5px;
      padding: 0 8px 0 5px;
      border-bottom: 1px solid #303030;
      background: #202020;
      user-select: none;
      font-family: "Segoe UI", Arial, sans-serif;
      text-shadow: none;
    }
    .active-tab {
      width: min(290px, calc(100vw - 92px));
      flex: 0 1 290px;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      padding: 0 9px;
      overflow: hidden;
      border: 1px solid #333;
      border-bottom-color: #101010;
      border-radius: 7px 7px 0 0;
      background: #101010;
      color: #dedede;
    }
    .app-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: grid;
      place-items: center;
      border: 1px solid #616161;
      border-radius: 2px;
      color: #e2e2e2;
      font: 700 9px/1 Consolas, monospace;
      background: #171717;
    }
    .title {
      flex: 1;
      overflow: hidden;
      color: #e2e2e2;
      font: 13px/1.2 "Segoe UI", Arial, sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-close, .tab-tool {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #c9c9c9;
      font: 15px/1 "Segoe UI", Arial, sans-serif;
    }
    .tab-close { width: 22px; height: 100%; }
    .tab-tools { display: flex; align-items: center; gap: 1px; }
    .tab-tool { width: 34px; height: 34px; font-size: 18px; }
    .tab-tool:last-child { font-size: 15px; }
    .terminal {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }
    .transcript {
      flex: 0 1 auto;
      min-height: 0;
      max-height: calc(100svh - 78px);
      overflow: auto;
      padding: 5px 8px 2px;
      color: #008000;
      font-size: clamp(16px, 1.15vw, 18px);
      line-height: 1.35;
      scrollbar-color: #075907 #000;
      scrollbar-width: thin;
      overflow-wrap: anywhere;
    }
    .line { min-height: 1.35em; white-space: pre-wrap; }
    .line.blank { min-height: .72em; }
    .line.banner {
      color: #008000;
      font-size: 1em;
      font-weight: 400;
      text-shadow: none;
    }
    .line.hint { color: #008000; }
    .line.error { color: #008000; }
    .command-line {
      display: flex;
      align-items: baseline;
      gap: 0;
      min-height: 1.35em;
      color: #008000;
    }
    .prompt { flex: 0 0 auto; color: #008000; }
    .command-text { color: #008000; }
    a {
      color: #008000;
      text-decoration: underline;
      text-decoration-color: rgba(0, 255, 0, .62);
      text-underline-offset: 3px;
    }
    a:hover, a:focus-visible { color: #c5ffc5; text-decoration-color: currentColor; }
    a:focus-visible { outline: 1px dotted #008000; outline-offset: 3px; }
    .input-form {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 0;
      padding: 0 8px 12px;
      color: #008000;
      font-size: clamp(16px, 1.15vw, 18px);
      line-height: 1.35;
    }
    .input-form label { flex: 0 0 auto; }
    #command {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: #008000;
      caret-color: #f4fff4;
      caret-shape: block;
      font: inherit;
    }
    #command::selection { background: #075907; color: #fff; }
    @media (max-width: 600px) {
      .titlebar { height: 38px; flex-basis: 38px; padding-right: 5px; }
      .active-tab { height: 34px; margin-top: 4px; }
      .tab-tool { width: 30px; }
      .transcript { max-height: calc(100svh - 72px); padding: 7px 8px 2px; font-size: clamp(14px, 4vw, 16px); }
      .input-form { padding: 0 8px max(12px, env(safe-area-inset-bottom)); font-size: clamp(14px, 4vw, 16px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="window" aria-label="Marius Ranta personal website">
    <header class="titlebar">
      <div class="active-tab">
        <span class="app-icon" aria-hidden="true">&gt;_</span>
        <span class="title">Command Prompt</span>
        <span class="tab-close" aria-hidden="true">×</span>
      </div>
      <div class="tab-tools" aria-hidden="true">
        <span class="tab-tool">+</span>
        <span class="tab-tool">⌄</span>
      </div>
    </header>
    <section class="terminal" aria-label="Interactive command prompt">
      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <form class="input-form" id="command-form" autocomplete="off">
        <label class="prompt" for="command">C:\Users\Marius&gt;</label>
        <input id="command" name="command" type="text" aria-label="Type a command" autocomplete="off" autocapitalize="off" spellcheck="false">
      </form>
    </section>
  </main>
  <script>
    const transcript = document.getElementById("transcript");
    const form = document.getElementById("command-form");
    const input = document.getElementById("command");
    const homePath = "C:" + String.fromCharCode(92) + "Users" + String.fromCharCode(92) + "Marius";
    const promptText = homePath + ">";
    const history = [];
    let historyIndex = 0;
    let draft = "";

    function addLine(text, className) {
      const line = document.createElement("div");
      line.className = "line" + (className ? " " + className : "");
      if (text === "") line.classList.add("blank");
      line.textContent = text;
      transcript.appendChild(line);
      transcript.scrollTop = transcript.scrollHeight;
      return line;
    }

    function addCommand(command) {
      const line = document.createElement("div");
      line.className = "line command-line";
      const prompt = document.createElement("span");
      prompt.className = "prompt";
      prompt.textContent = promptText;
      const text = document.createElement("span");
      text.className = "command-text";
      text.textContent = command;
      line.append(prompt, text);
      transcript.appendChild(line);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function addLinkLine(label, url) {
      const line = document.createElement("div");
      line.className = "line";
      line.append(document.createTextNode(label + " "));
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = url.replace(/^https?:\/\//, "");
      line.appendChild(link);
      transcript.appendChild(line);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function welcome() {
      addLine("Microsoft Windows [Version 10.0.19570.1000]", "banner");
      addLine("(c) 2020 Microsoft Corporation. All rights reserved.", "banner");
      addLine("");
      addLine("Type help to explore. Use ↑ and ↓ for command history.", "hint");
    }

    function run(commandText) {
      const raw = commandText.trim();
      if (!raw) return;
      addCommand(raw);
      const firstSpace = raw.search(/\s/);
      const command = (firstSpace < 0 ? raw : raw.slice(0, firstSpace)).toLowerCase();
      const argument = firstSpace < 0 ? "" : raw.slice(firstSpace).trim();

      switch (command) {
        case "help":
          addLine("Available commands:");
          addLine("  help         Show this list");
          addLine("  about        About Marius");
          addLine("  gf, girlfriend  Print Heta<3");
          addLine("  projects     Selected work");
          addLine("  experience   Education and experience");
          addLine("  contact      How to get in touch");
          addLine("  whoami       Show the current user");
          addLine("  date         Show the local date and time");
          addLine("  echo <text>  Print text to the console");
          addLine("  clear, cls   Clear the console");
          addLine("");
          addLine("Tip: commands are not case-sensitive.", "hint");
          break;
        case "gf":
        case "girlfriend":
          addLine("Heta<3");
          break;
        case "about":
          addLine("Marius Ranta");
          addLine("Computer science student at the University of Turku.");
          addLine("I enjoy designing, building, and solving problems with a team.");
          break;
        case "projects":
          addLine("Selected project:");
          addLine("  Command Prompt Portfolio — the interactive site you are viewing.");
          addLinkLine("  Source:", "https://github.com/mariusranta/portfolio");
          break;
        case "experience":
          addLine("Education");
          addLine("  Computer Science — University of Turku");
          addLine("");
          addLine("More experience details will be added here.");
          break;
        case "contact":
          addLine("You can reach me on GitHub:");
          addLinkLine("  Profile:", "https://github.com/mariusranta");
          addLine("No public email address is listed.");
          break;
        case "whoami":
          addLine("marius");
          break;
        case "date":
          addLine(new Intl.DateTimeFormat(undefined, { dateStyle: "full", timeStyle: "short" }).format(new Date()));
          break;
        case "echo":
          addLine(argument);
          break;
        case "clear":
        case "cls":
          transcript.replaceChildren();
          break;
        case "dir":
          addLine(" Directory of C:\\");
          addLine("");
          addLine("about.txt       About Marius");
          addLine("projects.txt    Selected work");
          addLine("experience.txt  Education and experience");
          addLine("contact.txt     Contact information");
          addLine("");
          addLine("  4 File(s)", "hint");
          break;
        case "ver":
          addLine("Microsoft Windows [Version 10.0.19570.1000]", "banner");
          break;
        default:
          addLine("'" + raw + "' is not recognized as an internal or external command,", "error");
          addLine("operable program or batch file.", "error");
          addLine("Type help to see the available commands.", "hint");
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const command = input.value;
      if (command.trim()) {
        history.push(command);
        historyIndex = history.length;
        draft = "";
        run(command);
      }
      input.value = "";
      input.focus();
    });

    input.addEventListener("keydown", function (event) {
      if (event.key === "ArrowUp") {
        if (history.length === 0) return;
        event.preventDefault();
        if (historyIndex === history.length) draft = input.value;
        historyIndex = Math.max(0, historyIndex - 1);
        input.value = history[historyIndex];
        input.setSelectionRange(input.value.length, input.value.length);
      } else if (event.key === "ArrowDown") {
        if (history.length === 0) return;
        event.preventDefault();
        historyIndex = Math.min(history.length, historyIndex + 1);
        input.value = historyIndex === history.length ? draft : history[historyIndex];
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });

    welcome();
    if (window.matchMedia("(pointer: fine)").matches) input.focus();
  </script>
</body>
</html>
