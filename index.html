<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Marius Ranta — personal website, presented as a classic command prompt.">
  <title>Marius Ranta</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="desktop" id="desktop">
  <main class="window" id="command-window" aria-label="Marius Ranta personal website">
    <header class="titlebar">
      <svg class="app-icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="2" width="14" height="11" rx="1" fill="none" stroke="currentColor"/>
        <path d="M2 4h12" stroke="currentColor"/>
        <path d="m4 6 2 1.5L4 9M7 9h3" fill="none" stroke="currentColor" stroke-linecap="square"/>
      </svg>
      <span class="title">Command Prompt</span>
      <div class="window-controls">
        <button class="window-control minimize" id="minimize-window" type="button" aria-label="Minimize Command Prompt" title="Minimize">
          <svg class="icon-minimize" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          <svg class="icon-restore" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11"/></svg>
        </button>
        <button class="window-control maximize" id="maximize-window" type="button" aria-label="Restore Command Prompt" title="Restore">
          <svg class="icon-maximize" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11"/></svg>
          <svg class="icon-restore-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h9.5V16M6.5 9.5v8h9"/></svg>
        </button>
        <button class="window-control close" id="close-window" type="button" aria-label="Close Command Prompt" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
    </header>
    <section class="terminal" aria-label="Interactive command prompt">
      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <form class="input-form" id="command-form" autocomplete="off">
        <label class="prompt" for="command">C:\Users\Marius&gt;</label>
        <input id="command" name="command" type="text" aria-label="Type a command" autocomplete="off" autocapitalize="off" spellcheck="false">
      </form>
    </section>
  </main>
  <section class="window projects-window" id="projects-window" aria-labelledby="projects-title" hidden>
    <header class="titlebar">
      <svg class="app-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h7l3 3V14.5h-10z" fill="none" stroke="currentColor"/><path d="M10 1.5v3h3M5 7h6M5 9.5h6M5 12h4" fill="none" stroke="currentColor"/></svg>
      <span class="title" id="projects-title">Projects - Notepad</span>
      <div class="window-controls">
        <button class="window-control minimize" id="minimize-projects" type="button" aria-label="Minimize Projects" title="Minimize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <button class="window-control maximize" id="maximize-projects" type="button" aria-label="Maximize Projects" title="Maximize"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11"/></svg></button>
        <button class="window-control close" id="close-projects" type="button" aria-label="Close Projects" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
      </div>
    </header>
    <div class="projects-document" id="projects-document" role="document" aria-label="Projects document" tabindex="0"></div>
  </section>
  </div>
  <button class="reopen-window" id="reopen-window" type="button" hidden>Open Command Prompt</button>
  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
