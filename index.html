<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Marius Ranta — personal website, presented as a classic command prompt.">
  <title>Command Prompt — Marius Ranta</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Lucida Console", Consolas, "Courier New", monospace;
      background: #000;
      color: #00FF00;
      font-weight: 400;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    .window {
      width: 100%;
      height: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }
    .window.is-windowed {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(960px, calc(100vw - 32px));
      height: min(640px, calc(100dvh - 32px));
      min-height: 0;
      transform: translate(-50%, -50%);
      border: 1px solid #494949;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .65);
    }
    .window.is-minimized {
      height: 30px;
      min-height: 0;
    }
    .window.is-minimized .terminal { display: none; }
    .window[hidden], .reopen-window[hidden] { display: none; }
    .titlebar {
      height: 30px;
      flex: 0 0 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 0 0 7px;
      border-bottom: 1px solid #202020;
      background: #3b3b3b;
      color: #eee;
      user-select: none;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .app-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      display: block;
      color: #dedede;
    }
    .title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: #eee;
      font: 400 12px/1 "Segoe UI", system-ui, sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .window-controls {
      height: 100%;
      flex: 0 0 auto;
      display: flex;
      align-items: stretch;
    }
    .window-control {
      appearance: none;
      width: 34px;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #eee;
      cursor: default;
    }
    .window-control svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }
    .window-control:hover { background: #505050; }
    .window-control:focus-visible { outline: 1px solid #fff; outline-offset: -3px; }
    .window-control.close { width: 34px; }
    .window-control.close svg { width: 14px; height: 14px; }
    .window-control.close:hover { color: #fff; background: #c42b1c; }
    .icon-restore, .icon-restore-down { display: none; }
    .window.is-minimized .icon-minimize { display: none; }
    .window.is-minimized .icon-restore { display: block; }
    .window.is-windowed .icon-maximize { display: none; }
    .window.is-windowed .icon-restore-down { display: block; }
    .reopen-window {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 16px;
      border: 1px solid #555;
      border-radius: 2px;
      background: #323232;
      color: #ededed;
      font: 14px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }
    .reopen-window:hover { background: #414141; }
    .reopen-window:focus-visible { outline: 2px solid #ededed; outline-offset: 3px; }
    .terminal {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }
    .transcript {
      flex: 0 1 auto;
      min-height: 0;
      max-height: calc(100svh - 78px);
      overflow: auto;
      padding: 5px 8px 2px;
      color: #00FF00;
      font-size: clamp(16px, 1.15vw, 18px);
      line-height: 1.35;
      scrollbar-color: #075907 #000;
      scrollbar-width: thin;
      overflow-wrap: anywhere;
    }
    .line { min-height: 1.35em; white-space: pre-wrap; }
    .line.blank { min-height: .72em; }
    .timeline {
      max-width: 100%;
      display: grid;
      gap: .2em;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .timeline-entry {
      display: grid;
      grid-template-columns: 9ch minmax(0, 1fr);
      column-gap: 1.25ch;
      min-width: 0;
      padding-bottom: .65em;
    }
    .timeline-date {
      color: #00FF00;
      font-size: .92em;
      line-height: 1.35;
      text-align: right;
      white-space: nowrap;
    }
    .timeline-content {
      position: relative;
      min-width: 0;
      padding: 0 0 .1em 1.3ch;
      border-left: 1px solid rgba(0, 255, 0, .48);
      overflow-wrap: anywhere;
    }
    .timeline-content::before {
      position: absolute;
      top: .42em;
      left: -3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #00FF00;
      content: "";
    }
    .timeline-role, .timeline-organization {
      display: block;
      color: #00FF00;
    }
    .timeline-description {
      margin-top: .28em;
      color: #00FF00;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .line.banner {
      color: #00FF00;
      font-size: 1em;
      font-weight: 400;
      text-shadow: none;
    }
    .line.hint { color: #00FF00; }
    .line.error { color: #00FF00; }
    .command-line {
      display: flex;
      align-items: baseline;
      gap: 0;
      min-height: 1.35em;
      color: #00FF00;
    }
    .prompt { flex: 0 0 auto; color: #00FF00; }
    .command-text { color: #00FF00; }
    a {
      color: #00FF00;
      text-decoration: underline;
      text-decoration-color: rgba(0, 255, 0, .62);
      text-underline-offset: 3px;
    }
    a:hover, a:focus-visible { color: #c5ffc5; text-decoration-color: currentColor; }
    a:focus-visible { outline: 1px dotted #00FF00; outline-offset: 3px; }
    .input-form {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 0;
      padding: 0 8px 12px;
      color: #00FF00;
      font-size: clamp(16px, 1.15vw, 18px);
      line-height: 1.35;
    }
    .input-form label { flex: 0 0 auto; }
    #command {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: #00FF00;
      caret-color: #f4fff4;
      caret-shape: block;
      font: inherit;
    }
    #command::selection { background: #075907; color: #fff; }
    @media (max-width: 600px) {
      .titlebar { height: 30px; flex-basis: 30px; padding-left: 7px; gap: 6px; }
      .window.is-minimized { height: 30px; }
      .window-control { width: 34px; }
      .window-control.close { width: 34px; }
      .timeline-entry { grid-template-columns: minmax(0, 1fr); gap: .15em; padding-bottom: .7em; }
      .timeline-date { text-align: left; }
      .timeline-content { margin-left: .25ch; }
      .transcript { max-height: calc(100svh - 72px); padding: 7px 8px 2px; font-size: clamp(14px, 4vw, 16px); }
      .input-form { padding: 0 8px max(12px, env(safe-area-inset-bottom)); font-size: clamp(14px, 4vw, 16px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="window" id="command-window" aria-label="Marius Ranta personal website">
    <header class="titlebar">
      <svg class="app-icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="2" width="14" height="11" rx="1" fill="none" stroke="currentColor"/>
        <path d="M2 4h12" stroke="currentColor"/>
        <path d="m4 6 2 1.5L4 9M7 9h3" fill="none" stroke="currentColor" stroke-linecap="square"/>
      </svg>
      <span class="title">Command Prompt</span>
      <div class="window-controls">
        <button class="window-control minimize" id="minimize-window" type="button" aria-label="Minimize Command Prompt" title="Minimize">
          <svg class="icon-minimize" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
          <svg class="icon-restore" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11"/></svg>
        </button>
        <button class="window-control maximize" id="maximize-window" type="button" aria-label="Restore Command Prompt" title="Restore">
          <svg class="icon-maximize" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11"/></svg>
          <svg class="icon-restore-down" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6.5h9.5V16M6.5 9.5v8h9"/></svg>
        </button>
        <button class="window-control close" id="close-window" type="button" aria-label="Close Command Prompt" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </div>
    </header>
    <section class="terminal" aria-label="Interactive command prompt">
      <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions text"></div>
      <form class="input-form" id="command-form" autocomplete="off">
        <label class="prompt" for="command">C:\Users\Marius&gt;</label>
        <input id="command" name="command" type="text" aria-label="Type a command" autocomplete="off" autocapitalize="off" spellcheck="false">
      </form>
    </section>
  </main>
  <button class="reopen-window" id="reopen-window" type="button" hidden>Open Command Prompt</button>
  <script>
    const transcript = document.getElementById("transcript");
    const form = document.getElementById("command-form");
    const input = document.getElementById("command");
    const commandWindow = document.getElementById("command-window");
    const minimizeButton = document.getElementById("minimize-window");
    const maximizeButton = document.getElementById("maximize-window");
    const closeButton = document.getElementById("close-window");
    const reopenButton = document.getElementById("reopen-window");
    const homePath = "C:" + String.fromCharCode(92) + "Users" + String.fromCharCode(92) + "Marius";
    const promptText = homePath + ">";
    const history = [];
    let historyIndex = 0;
    let draft = "";

    function addLine(text, className) {
      const line = document.createElement("div");
      line.className = "line" + (className ? " " + className : "");
      if (text === "") line.classList.add("blank");
      line.textContent = text;
      transcript.appendChild(line);
      transcript.scrollTop = transcript.scrollHeight;
      return line;
    }

    function addExperienceTimeline(entries) {
      const timeline = document.createElement("div");
      timeline.className = "line timeline";
      timeline.setAttribute("role", "list");

      entries.forEach(function (entry) {
        const item = document.createElement("div");
        item.className = "timeline-entry";
        item.setAttribute("role", "listitem");

        const date = document.createElement("div");
        date.className = "timeline-date";
        date.textContent = entry.date;

        const content = document.createElement("div");
        content.className = "timeline-content";

        const role = document.createElement("span");
        role.className = "timeline-role";
        role.textContent = entry.role;

        const organization = document.createElement("span");
        organization.className = "timeline-organization";
        organization.textContent = entry.organization;

        const description = document.createElement("div");
        description.className = "timeline-description";
        description.textContent = entry.description;

        content.append(role, organization, description);
        item.append(date, content);
        timeline.appendChild(item);
      });

      transcript.appendChild(timeline);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function addCommand(command) {
      const line = document.createElement("div");
      line.className = "line command-line";
      const prompt = document.createElement("span");
      prompt.className = "prompt";
      prompt.textContent = promptText;
      const text = document.createElement("span");
      text.className = "command-text";
      text.textContent = command;
      line.append(prompt, text);
      transcript.appendChild(line);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function addLinkLine(label, url) {
      const line = document.createElement("div");
      line.className = "line";
      line.append(document.createTextNode(label + " "));
      const link = document.createElement("a");
      link.href = url;
      if (!url.startsWith("mailto:")) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
      link.textContent = url.replace(/^mailto:/, "").replace(/^https?:\/\//, "");
      line.appendChild(link);
      transcript.appendChild(line);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function welcome() {
      addLine("Vunderbaum OS [Version 66.500000.25.720000]", "banner");
      addLine("(c) " + new Date().getFullYear() + " Marius Ranta. All rights reserved.", "banner");
      addLine("");
      addLine("Type help to explore. Use ↑ and ↓ for command history.", "hint");
    }

    function run(commandText) {
      const raw = commandText.trim();
      if (!raw) return;
      addCommand(raw);
      const firstSpace = raw.search(/\s/);
      const command = (firstSpace < 0 ? raw : raw.slice(0, firstSpace)).toLowerCase();
      const argument = firstSpace < 0 ? "" : raw.slice(firstSpace).trim();

      switch (command) {
        case "help":
          addLine("Available commands:");
          addLine("  help         Show this list");
          addLine("  about        About Marius");
          addLine("  projects     Selected work");
          addLine("  experience   Education and experience");
          addLine("  contact      How to get in touch");
          addLine("  whoami       Show the current user");
          addLine("  date         Show the local date and time");
          addLine("  echo <text>  Print text to the console");
          addLine("  clear, cls   Clear the console");
          addLine("");
          addLine("Tip: commands are not case-sensitive.", "hint");
          break;
        case "gf":
        case "girlfriend":
          addLine("Heta<3");
          break;
        case "about":
          addLine("Marius Ranta");
          addLine("Computer science student at the University of Turku.");
          addLine("I enjoy designing, building, and solving problems with a team.");
          break;
        case "projects":
          addLine("Selected project:");
          addLine("  Command Prompt Portfolio — the interactive site you are viewing.");
          addLinkLine("  Source:", "https://github.com/mariusranta/portfolio");
          break;
        case "experience":
          addLine("Experience", "hint");
          addExperienceTimeline([
            {
              date: "Present",
              role: "Computer Science Student",
              organization: "University of Turku",
              description: "Currently studying computer science."
            }
          ]);
          break;
        case "contact":
          addLine("Contact:");
          addLinkLine("  LinkedIn:", "https://www.linkedin.com/in/marius-ranta/");
          addLinkLine("  Email:", "mailto:mariusranta@gmail.com");
          break;
        case "whoami":
          addLine("marius");
          break;
        case "date":
          addLine(new Intl.DateTimeFormat("en-US", { dateStyle: "full", timeStyle: "short" }).format(new Date()));
          break;
        case "echo":
          addLine(argument);
          break;
        case "clear":
        case "cls":
          transcript.replaceChildren();
          break;
        case "dir":
          addLine(" Directory of C:\\");
          addLine("");
          addLine("about.txt       About Marius");
          addLine("projects.txt    Selected work");
          addLine("experience.txt  Education and experience");
          addLine("contact.txt     Contact information");
          addLine("");
          addLine("  4 File(s)", "hint");
          break;
        case "ver":
          addLine("Vunderbaum OS [Version 66.500000.25.720000]", "banner");
          break;
        default:
          addLine("'" + raw + "' is not recognized as an internal or external command,", "error");
          addLine("operable program or batch file.", "error");
          addLine("Type help to see the available commands.", "hint");
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const command = input.value;
      if (command.trim()) {
        history.push(command);
        historyIndex = history.length;
        draft = "";
        run(command);
      }
      input.value = "";
      input.focus();
    });

    input.addEventListener("keydown", function (event) {
      if (event.key === "ArrowUp") {
        if (history.length === 0) return;
        event.preventDefault();
        if (historyIndex === history.length) draft = input.value;
        historyIndex = Math.max(0, historyIndex - 1);
        input.value = history[historyIndex];
        input.setSelectionRange(input.value.length, input.value.length);
      } else if (event.key === "ArrowDown") {
        if (history.length === 0) return;
        event.preventDefault();
        historyIndex = Math.min(history.length, historyIndex + 1);
        input.value = historyIndex === history.length ? draft : history[historyIndex];
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });

    minimizeButton.addEventListener("click", function () {
      const minimized = commandWindow.classList.toggle("is-minimized");
      minimizeButton.setAttribute("aria-label", minimized ? "Restore Command Prompt" : "Minimize Command Prompt");
      minimizeButton.title = minimized ? "Restore" : "Minimize";
    });

    maximizeButton.addEventListener("click", function () {
      if (commandWindow.classList.contains("is-minimized")) {
        commandWindow.classList.remove("is-minimized");
        minimizeButton.setAttribute("aria-label", "Minimize Command Prompt");
        minimizeButton.title = "Minimize";
      }
      const windowed = commandWindow.classList.toggle("is-windowed");
      maximizeButton.setAttribute("aria-label", windowed ? "Maximize Command Prompt" : "Restore Command Prompt");
      maximizeButton.title = windowed ? "Maximize" : "Restore";
    });

    closeButton.addEventListener("click", function () {
      commandWindow.hidden = true;
      reopenButton.hidden = false;
      reopenButton.focus();
    });

    reopenButton.addEventListener("click", function () {
      reopenButton.hidden = true;
      commandWindow.hidden = false;
      commandWindow.classList.remove("is-minimized", "is-windowed");
      minimizeButton.setAttribute("aria-label", "Minimize Command Prompt");
      minimizeButton.title = "Minimize";
      maximizeButton.setAttribute("aria-label", "Restore Command Prompt");
      maximizeButton.title = "Restore";
      input.focus();
    });

    welcome();
    if (window.matchMedia("(pointer: fine)").matches) input.focus();
  </script>
</body>
</html>
